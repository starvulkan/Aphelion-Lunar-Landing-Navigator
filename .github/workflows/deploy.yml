# GitHub Pages Deployment Workflow
# Deploys the Aphelion Lunar Landing Navigator to GitHub Pages

name: Deploy to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main", "master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install dependencies
        run: |
          # No npm dependencies for this vanilla JS project
          echo "No dependencies to install"

      - name: Validate HTML
        run: |
          # Basic HTML validation
          if ! command -v htmlhint &> /dev/null; then
            npm install -g htmlhint
          fi
          htmlhint index.html || true

      - name: Validate CSS
        run: |
          if ! command -v stylelint &> /dev/null; then
            npm install -g stylelint stylelint-config-standard
          fi
          stylelint css/styles.css || true

      - name: Validate JavaScript
        run: |
          if ! command -v eslint &> /dev/null; then
            npm install -g eslint
          fi
          eslint js/ || true

      - name: Check for required files
        run: |
          required_files=(
            "index.html"
            "css/styles.css"
            "js/app.js"
            "js/ephemeris.js"
            "js/sites.js"
            "js/visualization.js"
            "js/educational.js"
            "js/comparison.js"
            "js/storage.js"
            "manifest.json"
            "graphics/icon.png"
            "graphics/logo.png"
          )
          
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing required file: $file"
              exit 1
            fi
          done
          echo "All required files present"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          # Exclude unnecessary files
          ignore-paths: |
            .github/
            .git/
            node_modules/
            *.md
            LICENSE
            README.md
            graphics/README.md

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployment
        run: |
          echo "Deployment completed successfully!"
          echo "Site URL: ${{ steps.deployment.outputs.page_url }}"
          # Optional: Add health check
          # sleep 10
          # curl -f "${{ steps.deployment.outputs.page_url }}" || exit 1